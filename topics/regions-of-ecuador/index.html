<!DOCTYPE html>
<html lang="es" data-redirect-page="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página trasladada | Las Cuatro Regiones de Ecuador</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper-bg: #f9f6ef;
      --paper-sheet: #fffdf9;
      --ink-main: #22201e;
      --ink-muted: #5e5953;
      --ink-rule: #d5cebf;
      --stamp-blue: #1d4373;
      --font-typewriter: "Courier Prime", "Courier New", Courier, monospace;
      --font-body: "Lora", Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper-bg);
      color: var(--ink-main);
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-image: radial-gradient(var(--ink-rule) 0.75px, transparent 0.75px);
      background-size: 24px 24px;
    }

    .notice-sheet {
      max-width: 480px;
      width: 100%;
      background-color: var(--paper-sheet);
      border: 1px solid #e8e2d5;
      box-shadow: 0 12px 38px rgba(45, 40, 35, 0.08), 0 3px 10px rgba(45, 40, 35, 0.04);
      border-radius: 3px;
      padding: 32px 28px;
      text-align: center;
    }

    .notice-text {
      color: var(--ink-muted);
      font-size: 16px;
      margin-bottom: 16px;
    }

    .notice-link {
      font-family: var(--font-typewriter);
      font-size: 17px;
      font-weight: 700;
      color: var(--stamp-blue);
      text-decoration: underline;
      word-break: break-word;
    }

    .notice-link:hover {
      color: var(--ink-main);
    }
  </style>
</head>
<body>
  <main class="notice-sheet">
    <p class="notice-text">Esta actividad se ha trasladado a una nueva dirección:</p>
    <a href="../regionsofecuador/index.html" class="notice-link">Las Cuatro Regiones de Ecuador →</a>
  </main>
</body>
</html>
